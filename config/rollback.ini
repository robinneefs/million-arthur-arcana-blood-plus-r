; Arcana Blood +R settings. The mod's Settings screen and My setup save here by themselves.
; Everything has a default: deleting this file resets Settings and My setup.
; Options for testing the netcode: docs/dev-settings.md in the GitHub repo.

[mod]
; 1 = the mod starts with the game, 0 = play the game without it (holding Shift while the game starts does the same once)
enabled=1

[update]
; 1 = the main menu says when a new version is out (asks GitHub when the game starts), 0 = never look
check=1
